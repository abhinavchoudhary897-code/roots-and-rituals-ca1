name: Build and validate exhibition
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: roots-and-rituals-ca1-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare synthetic audio
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg
          node scripts/build-narration.cjs
      - name: Check JavaScript
        run: |
          for file in data/*.js js/*.js scripts/*.cjs; do node --check "$file"; done
      - name: Browser acceptance tests
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 > /tmp/roots-server.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 2
          node scripts/browser-check.cjs
      - name: Lighthouse mobile and desktop quality audit
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright lighthouse
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          python3 -m http.server 8081 > /tmp/roots-audit-server.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 2
          for mode in mobile desktop; do
            echo "Lighthouse: $mode"
            preset=""
            if [ "$mode" = desktop ]; then preset="--preset=desktop"; fi
            npx lighthouse http://127.0.0.1:8081/ $preset --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/roots-lighthouse-$mode.json --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet --max-wait-for-load=30000
            node -e 'const r=require(process.argv[1]); for(const [k,v] of Object.entries(r.categories))console.log(k+": "+Math.round(v.score*100)+"/100"); console.log("CLS: "+r.audits["cumulative-layout-shift"].numericValue); for(const [k,v] of Object.entries(r.audits))if(v.score!==null&&v.score<0.9&&v.scoreDisplayMode!=="informative")console.log(k+": "+(v.displayValue||v.title));' "/tmp/roots-lighthouse-$mode.json"
          done
      - name: Validate museum image files
        run: |
          node -e 'global.window={}; require("./data/media.js"); for(const x of Object.values(window.EXHIBIT_MEDIA)) if(x.institution) console.log(x.preview)' > /tmp/museum-urls.txt
          while IFS= read -r url; do
            curl --fail --location --retry 2 --max-time 30 --silent --show-error "$url" -o /tmp/museum-image
            file --mime-type /tmp/museum-image | grep -q "image/"
            echo "Museum image reachable: $url"
          done < /tmp/museum-urls.txt
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js data assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
